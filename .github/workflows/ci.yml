# Types, lint, the unit tests, the route check and a production build. The workflow body is
# shared: minty-oliveandvine/.github -> .github/workflows/next-web.yml
#
# Browser tests (npm run test:e2e) need four services and the whole stack; they are not in the
# stack job yet, because walk/resume need a disposable entity Minty's seed does not create.
name: ci

on:
  push:
    branches: [main, development]
  pull_request:

jobs:
  check:
    uses: minty-oliveandvine/.github/.github/workflows/next-web.yml@v1
    with:
      extra-scripts: check:routes
      build-env: |
        PETTY_CASH_URL=http://localhost:8010
        ONBOARDING_API_URL=http://localhost:8030
